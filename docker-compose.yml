services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: openresearch
      POSTGRES_PASSWORD: openresearch
      POSTGRES_DB: openresearch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openresearch -d openresearch"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
